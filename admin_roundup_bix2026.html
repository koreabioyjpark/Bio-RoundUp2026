<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라운드업 관리자 | 현장 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAziEj4z6Uo7TnZpFwCimaw4mOjyfjgRjI",
    authDomain: "bio-roundup-2026.firebaseapp.com",
    projectId: "bio-roundup-2026",
    storageBucket: "bio-roundup-2026.firebasestorage.app",
    messagingSenderId: "109569887388",
    appId: "1:109569887388:web:f06ef486a6df185947b159",
    measurementId: "G-QEFPF4QJBL"
  };

  const DESK_NAMES = ["기업 1","기업 2","기업 3","기업 4","기업 5","기업 6"];
  const TIME_SLOTS = ["14:00~14:20","14:20~14:40","14:40~15:00","15:00~15:20","15:20~15:40","15:40~16:00"];
  const ADMIN_PW = "123";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let allData = [];

  window.addEventListener('DOMContentLoaded', () => {
    const pw = prompt("관리자 비밀번호를 입력하세요");
    if (pw !== ADMIN_PW) {
      document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#ef4444;font-size:20px;">접근 권한이 없습니다.</div>';
      return;
    }
    document.getElementById('load-btn').addEventListener('click', loadData);
    document.getElementById('csv-btn').addEventListener('click', exportCSV);
    document.getElementById('search-input').addEventListener('input', renderTable);

    loadData();
  });

  async function loadData() {
    const btn = document.getElementById('load-btn');
    btn.textContent = '로딩 중...';
    btn.disabled = true;
    allData = [];

    try {
      for (let d = 0; d < 6; d++) {
        for (let t = 0; t < 6; t++) {
          const id = `desk${d+1}_time${t+1}`;
          const snap = await getDoc(doc(db, "slots", id));
          if (snap.exists()) {
            const data = snap.data();
            (data.registrations || []).forEach(r => allData.push({ ...r, deskIdx: d, timeIdx: t, status: '상담 확정', slotId: id }));
            (data.waitlist || []).forEach(r => allData.push({ ...r, deskIdx: d, timeIdx: t, status: `예비 ${r.waitNum}`, waitNum: r.waitNum, slotId: id }));
          }
        }
      }
      updateStats();
      renderDashboard(); 
      renderTable();     
    } catch (e) {
      alert('로드 실패: ' + e.message);
    } finally {
      btn.textContent = '새로고침';
      btn.disabled = false;
    }
  }

  window.switchAdminTab = (tab) => {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[onclick="switchAdminTab('${tab}')"]`).classList.add('active');
    document.getElementById('view-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
    document.getElementById('view-list').style.display = tab === 'list' ? 'block' : 'none';
  };

  // ★ 현장 대시보드 렌더링 (이미지 레이아웃 구현) ★
  function renderDashboard() {
    const container = document.getElementById('dashboard-view');
    let html = '';
    
    for (let d = 0; d < 6; d++) {
      const boothItems = allData.filter(r => r.deskIdx === d);
      const totalReg = boothItems.filter(r => r.status === '상담 확정').length;
      const totalWait = boothItems.filter(r => r.status.includes('예비')).length;

      // 기업 섹션 시작 (헤더 + 통계)
      html += `
        <div class="booth-section">
          <div class="booth-header">
            <div class="booth-title">${DESK_NAMES[d]}</div>
            <div class="booth-stats">총 신청자: <strong>${totalReg}</strong> / 예비: <strong>${totalWait}</strong></div>
          </div>
          <div class="booth-time-grid">`;

      for (let t = 0; t < 6; t++) {
        const slotId = `desk${d+1}_time${t+1}`;
        const items = allData.filter(r => r.slotId === slotId);
        const regs = items.filter(r => r.status === '상담 확정');
        const waits = items.filter(r => r.status.includes('예비'));

        html += `<div class="time-box">
                  <div class="time-label">${TIME_SLOTS[t]}</div>
                  <div class="applicant-area">`;
        
        // 정규 확정자 3칸 (데이터 없으면 빈칸 처리)
        for (let i = 0; i < 3; i++) {
          const r = regs[i];
          if (r) {
            html += `<div class="slot-row row-reg" title="${r.univ} ${r.studentId}">
                      <span class="row-name">${r.name}</span>
                      <div class="row-btns">
                        <button onclick="handleActionDirect('demote','${slotId}','${r.uid}')">⬇</button>
                        <button onclick="handleActionDirect('delete','${slotId}','${r.uid}')">✕</button>
                      </div>
                    </div>`;
          } else {
            html += `<div class="slot-row row-empty">비어있음</div>`;
          }
        }

        // 예비 대기자 3칸 (데이터 없으면 빈칸 처리)
        for (let i = 0; i < 3; i++) {
          const w = waits[i];
          if (w) {
            html += `<div class="slot-row row-wait" title="${w.univ} ${w.studentId}">
                      <span class="row-name">예비${w.waitNum}. ${w.name}</span>
                      <div class="row-btns">
                        ${regs.length < 3 ? `<button onclick="handleActionDirect('promote','${slotId}','${w.uid}')">⬆</button>` : ''}
                        <button onclick="handleActionDirect('delete','${slotId}','${w.uid}')">✕</button>
                      </div>
                    </div>`;
          } else {
            html += `<div class="slot-row row-empty-wait">-</div>`;
          }
        }

        html += `</div></div>`; // time-box 닫기
      }
      html += `</div></div>`; // booth-section 닫기
    }
    container.innerHTML = html;
  }

  window.handleActionDirect = async (action, slotId, uid) => {
    const mockSelectEl = { value: action };
    await handleAction(mockSelectEl, slotId, uid);
  };

  window.handleAction = async (selectEl, slotId, uid) => {
    const action = selectEl.value;
    if (selectEl.tagName === 'SELECT') selectEl.value = ""; 
    if (!action) return;

    const slotRef = doc(db, "slots", slotId);
    const appRef = doc(db, "applicants", uid);

    try {
      await runTransaction(db, async (t) => {
        const snap = await t.get(slotRef);
        if(!snap.exists()) return;
        const data = snap.data();
        let regs = data.registrations || [];
        let waits = data.waitlist || [];
        const student = regs.find(r => r.uid === uid) || waits.find(r => r.uid === uid);
        if(!student) throw new Error("학생 정보를 찾을 수 없습니다.");

        const [dIdx, tIdx] = slotId.replace('desk', '').replace('_time', ',').split(',').map(x => Number(x) - 1);
        const boothInfo = `[${DESK_NAMES[dIdx]} / ${TIME_SLOTS[tIdx]}]`;
        let msg = ""; 

        if (action === 'delete') {
          if(!confirm(`[${student.name}] 학생의 신청을 취소하시겠습니까?`)) throw new Error("CANCEL");
          regs = regs.filter(r => r.uid !== uid);
          waits = waits.filter(r => r.uid !== uid);
          msg = `안내드립니다. 신청하신 ${boothInfo} 상담이 관리자에 의해 취소되었습니다. 자세한 사항은 사무국으로 문의 부탁드립니다.`;
        } else if (action === 'promote') {
          if(!confirm(`[${student.name}] 학생을 상담 확정 상태로 변경하시겠습니까?`)) throw new Error("CANCEL");
          if(regs.length >= 3) throw new Error("정원 초과");
          waits = waits.filter(r => r.uid !== uid);
          regs.push({ ...student, waitNum: null });
          msg = `안내드립니다. 신청하신 ${boothInfo} 상담이 "상담 확정" 상태로 변경되었습니다. 예약된 시간에 맞춰 참여 부탁드립니다.`;
        } else if (action === 'demote') {
          if(!confirm(`[${student.name}] 학생을 예비 대기 상태로 변경하시겠습니까?`)) throw new Error("CANCEL");
          regs = regs.filter(r => r.uid !== uid);
          waits.push({ ...student });
          msg = `안내드립니다. 신청하신 ${boothInfo} 상담이 "예비 대기" 상태로 변경되었습니다. 취소자 발생 시 순번에 따라 상태 변경 후 개별 안내드릴 예정입니다.`;
        }

        waits = waits.map((item, idx) => ({...item, waitNum: idx + 1}));
        t.update(slotRef, { registrations: regs, waitlist: waits });
        if (msg) t.update(appRef, { adminNotification: msg });
      });

      if (action === 'delete') {
        const aSnap = await getDoc(appRef);
        if(aSnap.exists()) {
           const newSlots = (aSnap.data().slots||[]).filter(s => s !== slotId);
           await updateDoc(appRef, { slots: newSlots });
        }
      }
      loadData();
    } catch(e) {
      if(e.message !== "CANCEL") alert("실패: " + e.message);
    }
  };

  function updateStats() {
    document.getElementById('stat-total').textContent = allData.length;
    document.getElementById('stat-regular').textContent = allData.filter(r => r.status === '상담 확정').length;
    document.getElementById('stat-waitlist').textContent = allData.filter(r => r.status.includes('예비')).length;
  }

  function renderTable() {
    const searchQ = document.getElementById('search-input').value.toLowerCase();
    let filtered = allData.filter(r => searchQ ? ((r.name||'').toLowerCase().includes(searchQ) || (r.studentId||'').toLowerCase().includes(searchQ)) : true);

    const tbody = document.getElementById('admin-tbody');
    tbody.innerHTML = filtered.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${DESK_NAMES[r.deskIdx]}</td>
        <td>${TIME_SLOTS[r.timeIdx]}</td>
        <td><span class="badge ${r.status === '상담 확정' ? 'badge-green' : 'badge-yellow'}">${r.status}</span></td>
        <td>
          <select class="action-select" onchange="handleAction(this, '${r.slotId}', '${r.uid}')">
            <option value="">작업 선택</option>
            ${r.status !== '상담 확정' ? `<option value="promote">상담 확정으로 전환</option>` : `<option value="demote">예비 대기로 변경</option>`}
            <option value="delete">신청 취소(삭제)</option>
          </select>
        </td>
        <td>${r.univ || '-'}</td>
        <td>${r.studentId || '-'}</td>
        <td>${r.name || '-'}</td>
        <td>${r.phone || '-'}</td>
        <td title="${r.preQuestion || ''}">${r.preQuestion ? (r.preQuestion.slice(0,10) + '...') : '-'}</td>
        <td>${r.appliedAt ? r.appliedAt.slice(5,16).replace('T',' ') : '-'}</td>
      </tr>
    `).join('');
  }

  function exportCSV() {
    if (allData.length === 0) return;
    const headers = ['번호','데스크','시간','상태','대학','학번','이름','연락처','사전질문','신청시각'];
    const rows = allData.map((r, i) => [i+1, DESK_NAMES[r.deskIdx], TIME_SLOTS[r.timeIdx], r.status, r.univ||'', r.studentId||'', r.name||'', r.phone||'', (r.preQuestion||'').replace(/"/g, '""'), r.appliedAt||'']);
    const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `roundup_신청목록.csv`;
    a.click();
  }
</script>

<style>
  :root { --bg: #f0f2f5; --surface: #ffffff; --border: #d1d5db; --accent: #2a5c9e; --green: #10B981; --yellow: #D97706; --red: #EF4444; --text: #1f2937; --text-light: #6b7280; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
  
  .admin-header { background: #1a1c23; color: #fff; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; position: sticky; top:0; z-index:100; }
  .admin-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }

  .container { padding: 20px; max-width: 1600px; margin: 0 auto; }

  /* 탭 */
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
  .tab-btn { padding: 12px 24px; border: none; background: none; font-size: 16px; font-weight: 700; color: var(--text-light); cursor: pointer; border-radius: 8px 8px 0 0; }
  .tab-btn.active { background: var(--surface); color: var(--accent); border-bottom: 4px solid var(--accent); }

  /* ★ 현장 대시보드 (보내주신 이미지 레이아웃 구현) ★ */
  .dashboard-grid { display: flex; flex-direction: column; gap: 30px; }
  .booth-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .booth-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
  .booth-title { font-size: 22px; font-weight: 900; color: var(--accent); }
  .booth-stats { font-size: 14px; color: var(--text-light); }
  
  .booth-time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; } /* 3열 2행 구조 */
  .time-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
  .time-label { background: #475569; color: #fff; font-size: 12px; font-weight: 800; padding: 5px; border-radius: 5px; text-align: center; margin-bottom: 10px; }
  
  .applicant-area { display: flex; flex-direction: column; gap: 4px; }
  .slot-row { height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 12px; font-weight: 700; transition: 0.2s; }
  .row-reg { background: #E1F0E8; color: var(--green); border: 1px solid #10B981; }
  .row-wait { background: #FFFBEB; color: var(--yellow); border: 1px solid #FDE68A; }
  .row-empty { background: #f3f4f6; color: #9ca3af; border: 1px dotted #d1d5db; font-weight: normal; }
  .row-empty-wait { background: transparent; color: #e5e7eb; border: 1px dashed #e5e7eb; font-weight: normal; text-align: center; justify-content: center; }
  
  .row-btns { display: flex; gap: 4px; }
  .row-btns button { background: #fff; border: 1px solid rgba(0,0,0,0.1); width: 20px; height: 20px; border-radius: 4px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .row-btns button:hover { background: #f0f0f0; }

  /* 리스트 뷰 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 900; color: var(--accent); }
  .filters { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
  .filters input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; flex-grow: 1; }
  .admin-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
  .admin-table th { background: #f9fafb; padding: 12px; text-align: left; border-bottom: 2px solid #eee; }
  .admin-table td { padding: 12px; border-bottom: 1px solid #eee; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .badge-green { background: #E1F0E8; color: var(--green); }
  .badge-yellow { background: #FFFBEB; color: var(--yellow); }
</style>
</head>
<body>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:15px;">
    <h1>ROUNDUP ADMIN</h1>
    <button class="btn btn-accent" id="load-btn">데이터 새로고침</button>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-green" id="csv-btn">CSV 다운로드</button>
  </div>
</header>

<div class="container">
  
  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchAdminTab('dashboard')">📊 현장 대시보드</button>
    <button class="tab-btn" onclick="switchAdminTab('list')">📄 전체 명단 보기</button>
  </div>

  <div id="view-dashboard">
    <div id="dashboard-view" class="dashboard-grid">
      </div>
  </div>

  <div id="view-list" style="display: none;">
    <div class="stats">
      <div class="stat-card"><div style="font-size:12px; color:var(--text-light);">전체 신청 건수</div><div class="stat-value" id="stat-total">-</div></div>
      <div class="stat-card"><div style="font-size:12px; color:var(--text-light);">상담 확정 인원</div><div class="stat-value" id="stat-regular" style="color:var(--green);">-</div></div>
      <div class="stat-card"><div style="font-size:12px; color:var(--text-light);">예비 대기 인원</div><div class="stat-value" id="stat-waitlist" style="color:var(--yellow);">-</div></div>
    </div>

    <div class="filters">
      <input type="text" id="search-input" placeholder="이름 또는 학번으로 빠른 검색...">
    </div>

    <div style="overflow-x: auto; background: #fff; border-radius: 12px; border: 1px solid var(--border);">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th><th>기업</th><th>시간</th><th>상태</th><th>작업</th><th>대학</th><th>학번</th><th>성명</th><th>연락처</th><th>사전질문</th><th>시각</th>
          </tr>
        </thead>
        <tbody id="admin-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
