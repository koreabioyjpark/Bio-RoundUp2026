<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라운드업 관리자 | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAziEj4z6Uo7TnZpFwCimaw4mOjyfjgRjI",
    authDomain: "bio-roundup-2026.firebaseapp.com",
    projectId: "bio-roundup-2026",
    storageBucket: "bio-roundup-2026.firebasestorage.app",
    messagingSenderId: "109569887388",
    appId: "1:109569887388:web:f06ef486a6df185947b159",
    measurementId: "G-QEFPF4QJBL"
  };

  const DESK_NAMES = ["기업 1","기업 2","기업 3","기업 4","기업 5","기업 6"];
  const TIME_SLOTS = ["14:00~14:20","14:20~14:40","14:40~15:00","15:00~15:20","15:20~15:40","15:40~16:00"];
  const ADMIN_PW = "123";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let allData = [];

  window.addEventListener('DOMContentLoaded', () => {
    const pw = prompt("관리자 비밀번호를 입력하세요");
    if (pw !== ADMIN_PW) {
      document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#ef4444;font-size:20px;">접근 권한이 없습니다.</div>';
      return;
    }
    document.getElementById('load-btn').addEventListener('click', loadData);
    document.getElementById('csv-btn').addEventListener('click', exportCSV);
    document.getElementById('filter-desk').addEventListener('change', renderTable);
    document.getElementById('filter-time').addEventListener('change', renderTable);
    document.getElementById('filter-type').addEventListener('change', renderTable);
    document.getElementById('search-input').addEventListener('input', renderTable);

    const deskSel = document.getElementById('filter-desk');
    DESK_NAMES.forEach((n, i) => deskSel.innerHTML += `<option value="desk${i+1}">${n}</option>`);
    const timeSel = document.getElementById('filter-time');
    TIME_SLOTS.forEach((t, i) => timeSel.innerHTML += `<option value="time${i+1}">${t}</option>`);

    loadData();
  });

  async function loadData() {
    const btn = document.getElementById('load-btn');
    btn.textContent = '로딩 중...';
    btn.disabled = true;
    allData = [];

    try {
      for (let d = 0; d < 6; d++) {
        for (let t = 0; t < 6; t++) {
          const id = `desk${d+1}_time${t+1}`;
          const snap = await getDoc(doc(db, "slots", id));
          if (snap.exists()) {
            const data = snap.data();
            (data.registrations || []).forEach(r => allData.push({ ...r, deskIdx: d, timeIdx: t, status: '상담 확정', slotId: id }));
            (data.waitlist || []).forEach(r => allData.push({ ...r, deskIdx: d, timeIdx: t, status: `예비 ${r.waitNum}번`, waitNum: r.waitNum, slotId: id }));
          }
        }
      }
      updateStats();
      renderDashboard(); // 현장 대시보드 렌더링
      renderTable();     // 엑셀표 렌더링
    } catch (e) {
      alert('데이터 로드 실패: ' + e.message);
    } finally {
      btn.textContent = '새로고침';
      btn.disabled = false;
    }
  }

  // ★ 탭 전환 로직 ★
  window.switchAdminTab = (tab) => {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[onclick="switchAdminTab('${tab}')"]`).classList.add('active');
    document.getElementById('view-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
    document.getElementById('view-list').style.display = tab === 'list' ? 'block' : 'none';
  };

  // ★ 현장 대시보드 렌더링 로직 ★
  function renderDashboard() {
    const container = document.getElementById('dashboard-grid');
    let html = '';
    
    for (let d = 0; d < 6; d++) {
      html += `<div class="board-col"><div class="board-col-title">${DESK_NAMES[d]}</div>`;
      for (let t = 0; t < 6; t++) {
        const slotId = `desk${d+1}_time${t+1}`;
        const items = allData.filter(r => r.slotId === slotId);
        const regs = items.filter(r => r.status === '상담 확정');
        const waits = items.filter(r => r.status.includes('예비'));
        
        html += `<div class="board-slot">
                  <div class="board-time">${TIME_SLOTS[t]} <span style="font-weight:normal; color:#9ca3af; font-size:11px;">(${regs.length}/3명)</span></div>`;
        
        if (regs.length === 0 && waits.length === 0) {
          html += `<div class="board-empty">예약 없음</div>`;
        } else {
          // 확정자 렌더링
          regs.forEach(r => {
            html += `
              <div class="board-item item-reg">
                <div class="item-info">
                  <strong>${r.name}</strong> <span class="item-univ">${r.univ}</span>
                </div>
                <div class="item-actions">
                  <button class="action-icon" onclick="handleActionDirect('demote', '${slotId}', '${r.uid}')" title="예비 대기로 강등">⬇</button>
                  <button class="action-icon action-del" onclick="handleActionDirect('delete', '${slotId}', '${r.uid}')" title="신청 취소">✖</button>
                </div>
              </div>`;
          });
          // 대기자 렌더링
          waits.forEach(r => {
            html += `
              <div class="board-item item-wait">
                <div class="item-info">
                  <span class="wait-badge">예비 ${r.waitNum}</span>
                  <strong>${r.name}</strong> <span class="item-univ">${r.univ}</span>
                </div>
                <div class="item-actions">
                  ${regs.length < 3 ? `<button class="action-icon action-up" onclick="handleActionDirect('promote', '${slotId}', '${r.uid}')" title="상담 확정으로 전환">⬆</button>` : ''}
                  <button class="action-icon action-del" onclick="handleActionDirect('delete', '${slotId}', '${r.uid}')" title="신청 취소">✖</button>
                </div>
              </div>`;
          });
        }
        html += `</div>`; // board-slot 닫기
      }
      html += `</div>`; // board-col 닫기
    }
    container.innerHTML = html;
  }

  window.handleActionDirect = async (action, slotId, uid) => {
    const mockSelectEl = { value: action };
    await handleAction(mockSelectEl, slotId, uid);
  };

  // 기존 상태 관리 로직
  window.handleAction = async (selectEl, slotId, uid) => {
    const action = selectEl.value;
    selectEl.value = ""; 
    if (!action) return;

    const slotRef = doc(db, "slots", slotId);
    const appRef = doc(db, "applicants", uid);

    try {
      await runTransaction(db, async (t) => {
        const snap = await t.get(slotRef);
        if(!snap.exists()) return;
        const data = snap.data();
        let regs = data.registrations || [];
        let waits = data.waitlist || [];

        const student = regs.find(r => r.uid === uid) || waits.find(r => r.uid === uid);
        if(!student) throw new Error("학생 정보를 찾을 수 없습니다.");

        const [dIdx, tIdx] = slotId.replace('desk', '').replace('_time', ',').split(',').map(x => Number(x) - 1);
        const boothInfo = `[${DESK_NAMES[dIdx]} / ${TIME_SLOTS[tIdx]}]`;
        let msg = ""; 

        if (action === 'delete') {
          if(!confirm(`[${student.name}] 학생의 신청을 취소하시겠습니까?`)) throw new Error("CANCEL");
          regs = regs.filter(r => r.uid !== uid);
          waits = waits.filter(r => r.uid !== uid);
          msg = `안내드립니다. 신청하신 ${boothInfo} 상담이 관리자에 의해 취소되었습니다. 자세한 사항은 사무국으로 문의 부탁드립니다.`;
        } else if (action === 'promote') {
          if(!confirm(`[${student.name}] 학생을 상담 확정 상태로 변경하시겠습니까?`)) throw new Error("CANCEL");
          if(regs.length >= 3) throw new Error("정원 초과로 확정할 수 없습니다.");
          waits = waits.filter(r => r.uid !== uid);
          regs.push({ ...student, waitNum: null });
          msg = `안내드립니다. 신청하신 ${boothInfo} 상담이 "상담 확정" 상태로 변경되었습니다. 예약된 시간에 맞춰 참여 부탁드립니다.`;
        } else if (action === 'demote') {
          if(!confirm(`[${student.name}] 학생을 예비 대기 상태로 변경하시겠습니까?`)) throw new Error("CANCEL");
          regs = regs.filter(r => r.uid !== uid);
          waits.push({ ...student });
          msg = `안내드립니다. 신청하신 ${boothInfo} 상담이 "예비 대기" 상태로 변경되었습니다. 취소자 발생 시 순번에 따라 상태 변경 후 개별 안내드릴 예정입니다.`;
        }

        waits = waits.map((item, idx) => ({...item, waitNum: idx + 1}));
        t.update(slotRef, { registrations: regs, waitlist: waits });

        if (msg) {
          t.update(appRef, { adminNotification: msg });
        }
      });

      if (action === 'delete') {
        const aSnap = await getDoc(appRef);
        if(aSnap.exists()) {
           const newSlots = (aSnap.data().slots||[]).filter(s => s !== slotId);
           await updateDoc(appRef, { slots: newSlots });
        }
      }
      loadData();
    } catch(e) {
      if(e.message !== "CANCEL") alert("처리 실패: " + e.message);
    }
  };

  function updateStats() {
    document.getElementById('stat-total').textContent = allData.length;
    document.getElementById('stat-regular').textContent = allData.filter(r => r.status === '상담 확정').length;
    document.getElementById('stat-waitlist').textContent = allData.filter(r => r.status !== '상담 확정').length;
    document.getElementById('stat-students').textContent = new Set(allData.map(r => r.uid)).size;
  }

  function renderTable() {
    const deskF = document.getElementById('filter-desk').value;
    const timeF = document.getElementById('filter-time').value;
    const typeF = document.getElementById('filter-type').value;
    const searchQ = document.getElementById('search-input').value.toLowerCase();

    let filtered = allData.filter(r => {
      if (deskF !== 'all' && r.slotId.split('_')[0] !== deskF) return false;
      if (timeF !== 'all' && r.slotId.split('_')[1] !== timeF) return false;
      if (typeF === 'regular' && r.status !== '상담 확정') return false;
      if (typeF === 'waitlist' && r.status === '상담 확정') return false;
      if (searchQ && !((r.name||'').toLowerCase().includes(searchQ) || (r.studentId||'').toLowerCase().includes(searchQ))) return false;
      return true;
    });

    const tbody = document.getElementById('admin-tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:40px;color:var(--gray);">데이터 없음</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${DESK_NAMES[r.deskIdx]}</td>
        <td>${TIME_SLOTS[r.timeIdx]}</td>
        <td><span class="badge ${r.status === '상담 확정' ? 'badge-green' : 'badge-yellow'}">${r.status}</span></td>
        <td>
          <select class="action-select" onchange="handleAction(this, '${r.slotId}', '${r.uid}')">
            <option value="">작업 선택</option>
            ${r.status !== '상담 확정' ? `<option value="promote">상담 확정으로 전환</option>` : `<option value="demote">예비 대기로 변경</option>`}
            <option value="delete">신청 취소(삭제)</option>
          </select>
        </td>
        <td>${r.univ || '-'}</td>
        <td>${r.studentId || '-'}</td>
        <td>${r.name || '-'}</td>
        <td>${r.phone || '-'}</td>
        <td>${r.email || '-'}</td>
        <td title="${r.preQuestion || ''}">${r.preQuestion ? (r.preQuestion.slice(0,10) + '...') : '-'}</td>
        <td>${r.appliedAt ? r.appliedAt.slice(5,16).replace('T',' ') : '-'}</td>
      </tr>
    `).join('');
  }

  window.exportCSV = () => {
    if (allData.length === 0) { alert('데이터가 없습니다.'); return; }
    const headers = ['번호','데스크','시간','상태','대학','학번','이름','연락처','이메일','사전질문','신청시각'];
    const rows = allData.map((r, i) => [
      i+1, DESK_NAMES[r.deskIdx], TIME_SLOTS[r.timeIdx], r.status, r.univ||'', r.studentId||'',
      r.name||'', r.phone||'', r.email||'', (r.preQuestion||'').replace(/"/g, '""'), r.appliedAt||''
    ]);
    const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `roundup_목록_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };
</script>

<style>
  :root { --bg: #0d0f14; --surface: #161922; --surface2: #1e2230; --border: #2a2f3e; --accent: #4f8ef7; --green: #10B981; --yellow: #F59E0B; --red: #EF4444; --gray: #6b7280; --text: #e8eaf0; --text2: #9ca3af; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; }
  .admin-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .admin-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--accent); }
  .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; } .btn-accent { background: var(--accent); color: #fff; } .btn-green { background: #22c55e; color: #fff; }
  .container { padding: 24px; max-width: 1440px; margin: 0 auto; }
  
  /* 탭 네비게이션 */
  .admin-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .tab-btn { background: transparent; border: none; color: var(--text2); font-size: 16px; font-weight: 700; cursor: pointer; padding: 10px 20px; border-radius: 8px; font-family: inherit; transition: all 0.2s; }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .tab-btn.active { color: #fff; background: var(--surface2); border-bottom: 3px solid var(--accent); border-radius: 8px 8px 0 0; }

  /* 대시보드 (칸반 뷰) */
  .dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; min-width: 1200px; overflow-x: auto; padding-bottom: 20px; }
  .board-col { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .board-col-title { font-size: 17px; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--surface2); letter-spacing: 1px; }
  .board-slot { background: var(--surface2); border-radius: 8px; padding: 12px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.02); }
  .board-time { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 12px; text-align: center; background: #252a36; border-radius: 6px; padding: 6px; }
  .board-empty { text-align: center; font-size: 12px; color: var(--gray); padding: 10px 0; font-weight: 500; }
  .board-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,0.3); font-size: 13px; }
  .item-reg { border-left: 4px solid var(--green); }
  .item-wait { border-left: 4px solid var(--yellow); opacity: 0.85; }
  .item-info { display: flex; flex-direction: column; gap: 3px; }
  .item-univ { font-size: 11px; color: var(--text2); }
  .wait-badge { display: inline-block; font-size: 10px; background: rgba(245,158,11,0.2); color: var(--yellow); padding: 2px 6px; border-radius: 4px; font-weight: 700; width: fit-content; margin-bottom: 2px; }
  .item-actions { display: flex; gap: 4px; }
  .action-icon { background: var(--surface); border: 1px solid var(--border); color: var(--text2); width: 24px; height: 24px; border-radius: 4px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .action-icon:hover { background: var(--border); color: #fff; }
  .action-up { color: var(--green); } .action-up:hover { background: rgba(16,185,129,0.2); }
  .action-del { color: var(--red); } .action-del:hover { background: rgba(239,68,68,0.2); }

  /* 리스트 뷰 (기존 화면) */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .stat-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 900; color: var(--text); }
  .filters { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 7px; font-family: inherit; font-size: 13px; outline: none; }
  .table-wrap-list { overflow-x: auto; }
  .admin-table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  .admin-table th { background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 13px; }
  .admin-table tbody tr:hover { background: var(--surface2); }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-green { background: rgba(16,185,129,0.2); color: var(--green); } .badge-yellow { background: rgba(245,158,11,0.2); color: var(--yellow); }
  .action-select { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 4px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; outline:none; }
  .action-select option { background: var(--surface); color: var(--text); }
  .back-link { font-size: 12px; color: var(--gray); text-decoration: none; } .back-link:hover { color: var(--text2); }
</style>
</head>
<body>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="index.html" class="back-link">← 신청 페이지</a>
    <h1>ADMIN</h1>
    <span style="color:var(--text2);font-size:12px;">라운드업 상담부스 관리</span>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-accent" id="load-btn">새로고침</button>
    <button class="btn btn-green" id="csv-btn">CSV 다운로드</button>
  </div>
</header>

<div class="container">
  
  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchAdminTab('dashboard')">📊 현장 대시보드</button>
    <button class="tab-btn" onclick="switchAdminTab('list')">📄 전체 목록 보기</button>
  </div>

  <div id="view-dashboard">
    <div id="dashboard-grid" class="dashboard-grid">
      </div>
  </div>

  <div id="view-list" style="display: none;">
    <div class="stats">
      <div class="stat-card"><div class="stat-label">전체 신청</div><div class="stat-value" id="stat-total">-</div></div>
      <div class="stat-card"><div class="stat-label">상담 확정</div><div class="stat-value" id="stat-regular">-</div></div>
      <div class="stat-card"><div class="stat-label">예비 대기</div><div class="stat-value" id="stat-waitlist">-</div></div>
      <div class="stat-card"><div class="stat-label">신청 학생 수</div><div class="stat-value" id="stat-students">-</div></div>
    </div>

    <div class="filters">
      <span style="font-size:12px;color:var(--text2);font-weight:600;">필터:</span>
      <select id="filter-desk"><option value="all">모든 기업</option></select>
      <select id="filter-time"><option value="all">모든 시간</option></select>
      <select id="filter-type">
        <option value="all">전체보기</option>
        <option value="regular">상담 확정만</option>
        <option value="waitlist">예비 대기만</option>
      </select>
      <div style="flex-grow:1;"></div>
