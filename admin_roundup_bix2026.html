<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라운드업 관리자 | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ★ index.html과 동일한 firebaseConfig 입력 ★
  const firebaseConfig = {
    apiKey: "AIzaSyAziEj4z6Uo7TnZpFwCimaw4mOjyfjgRjI",
    authDomain: "bio-roundup-2026.firebaseapp.com",
    projectId: "bio-roundup-2026",
    storageBucket: "bio-roundup-2026.firebasestorage.app",
    messagingSenderId: "109569887388",
    appId: "1:109569887388:web:f06ef486a6df185947b159",
    measurementId: "G-QEFPF4QJBL"
  };

  const DESK_NAMES = ["기업 1","기업 2","기업 3","기업 4","기업 5","기업 6"];
  const TIME_SLOTS = ["14:00~14:20","14:20~14:40","14:40~15:00","15:00~15:20","15:20~15:40","15:40~16:00"];

  // 간단한 비밀번호 보호
  const ADMIN_PW = "roundup2026";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allData = [];

  window.addEventListener('DOMContentLoaded', () => {
    const pw = prompt("관리자 비밀번호를 입력하세요");
    if (pw !== ADMIN_PW) {
      document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#ef4444;font-size:20px;font-family:sans-serif;">접근 권한이 없습니다.</div>';
      return;
    }

    document.getElementById('load-btn').addEventListener('click', loadData);
    document.getElementById('csv-btn').addEventListener('click', exportCSV);
    document.getElementById('filter-desk').addEventListener('change', renderTable);
    document.getElementById('filter-time').addEventListener('change', renderTable);
    document.getElementById('filter-type').addEventListener('change', renderTable);

    // 필터 옵션 세팅
    const deskSel = document.getElementById('filter-desk');
    DESK_NAMES.forEach((n, i) => deskSel.innerHTML += `<option value="desk${i+1}">${n}</option>`);
    const timeSel = document.getElementById('filter-time');
    TIME_SLOTS.forEach((t, i) => timeSel.innerHTML += `<option value="time${i+1}">${t}</option>`);

    loadData();
  });

  async function loadData() {
    const btn = document.getElementById('load-btn');
    btn.textContent = '로딩 중...';
    btn.disabled = true;
    allData = [];

    try {
      for (let d = 0; d < 6; d++) {
        for (let t = 0; t < 6; t++) {
          const id = `desk${d+1}_time${t+1}`;
          const ref = doc(db, "slots", id);
          const snap = await getDoc(ref);
          if (snap.exists()) {
            const data = snap.data();
            (data.registrations || []).forEach(r => {
              allData.push({ ...r, deskIdx: d, timeIdx: t, status: '정규', slotId: id });
            });
            (data.waitlist || []).forEach(r => {
              allData.push({ ...r, deskIdx: d, timeIdx: t, status: `예비${r.waitNum}번`, slotId: id });
            });
          }
        }
      }
      updateStats();
      renderTable();
    } catch (e) {
      console.error(e);
      alert('데이터 로드 실패: ' + e.message);
    } finally {
      btn.textContent = '새로고침';
      btn.disabled = false;
    }
  }

  // ★ 추가된 수동 승격 함수 ★
  async function promoteToRegular(slotId, uid) {
    if (!confirm("이 학생을 정규 신청자로 승격시키겠습니까?")) return;

    const slotRef = doc(db, "slots", slotId);
    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(slotRef);
        if (!snap.exists()) return;
        
        const data = snap.data();
        const waitlist = data.waitlist || [];
        const registrations = data.registrations || [];

        // 1. 예비 명단에서 학생 찾기
        const student = waitlist.find(r => r.uid === uid);
        if (!student) {
          throw new Error("해당 학생이 예비 명단에 존재하지 않습니다.");
        }
        
        // 2. 정규 명단 T/O 확인 (최대 3명)
        if (registrations.length >= 3) {
          throw new Error("현재 정규 인원이 3명으로 가득 찼습니다. 기존 정규 인원 취소가 선행되어야 합니다.");
        }

        // 3. 예비에서 제거하고 정규에 추가 (waitNum 속성 제거)
        const newWaitlist = waitlist.filter(r => r.uid !== uid);
        const newRegistrations = [...registrations, { ...student, waitNum: null }];

        transaction.update(slotRef, {
          waitlist: newWaitlist,
          registrations: newRegistrations
        });
      });
      alert("승격 처리가 완료되었습니다.");
      loadData(); // 표 새로고침
    } catch (e) {
      alert("승격 실패: " + e.message);
    }
  }
  
  // HTML 내부의 onclick 이벤트에서 호출할 수 있도록 전역 객체에 매핑
  window._promote = promoteToRegular;

  function updateStats() {
    const total = allData.length;
    const regular = allData.filter(r => r.status === '정규').length;
    const waitlist = allData.filter(r => r.status !== '정규').length;
    const uniqueStudents = new Set(allData.map(r => r.studentId)).size;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-regular').textContent = regular;
    document.getElementById('stat-waitlist').textContent = waitlist;
    document.getElementById('stat-students').textContent = uniqueStudents;
  }

  function renderTable() {
    const deskF = document.getElementById('filter-desk').value;
    const timeF = document.getElementById('filter-time').value;
    const typeF = document.getElementById('filter-type').value;

    let filtered = allData.filter(r => {
      if (deskF !== 'all' && r.slotId.split('_')[0] !== deskF) return false;
      if (timeF !== 'all' && r.slotId.split('_')[1] !== timeF) return false;
      if (typeF === 'regular' && r.status !== '정규') return false;
      if (typeF === 'waitlist' && r.status === '정규') return false;
      return true;
    });

    const tbody = document.getElementById('admin-tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--gray);">데이터 없음</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${DESK_NAMES[r.deskIdx]}</td>
        <td>${TIME_SLOTS[r.timeIdx]}</td>
        <td>
          <span class="badge ${r.status === '정규' ? 'badge-green' : 'badge-yellow'}">${r.status}</span>
          ${r.status !== '정규' ? `<button class="btn-sm" onclick="window._promote('${r.slotId}', '${r.uid}')">승격</button>` : ''}
        </td>
        <td>${r.univ || '-'}</td>
        <td>${r.studentId || '-'}</td>
        <td>${r.name || '-'}</td>
        <td>${r.phone || '-'}</td>
        <td>${r.email || '-'}</td>
        <td title="${r.preQuestion || ''}">${r.preQuestion ? (r.preQuestion.slice(0,12) + '...') : '-'}</td>
        <td>${r.appliedAt ? r.appliedAt.slice(0,16).replace('T',' ') : '-'}</td>
      </tr>
    `).join('');
  }

  function exportCSV() {
    if (allData.length === 0) { alert('데이터가 없습니다.'); return; }

    const headers = ['번호','데스크','시간','상태','대학','학번','이름','연락처','이메일','사전질문','신청시각'];
    const rows = allData.map((r, i) => [
      i+1,
      DESK_NAMES[r.deskIdx],
      TIME_SLOTS[r.timeIdx],
      r.status,
      r.univ||'',
      r.studentId||'',
      r.name||'',
      r.phone||'',
      r.email||'',
      (r.preQuestion||'').replace(/"/g, '""'), // 줄바꿈/따옴표 방지
      r.appliedAt ? r.appliedAt.slice(0,16).replace('T',' ') : ''
    ]);

    const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `roundup_신청자목록_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  window.loadData = loadData;
  window.exportCSV = exportCSV;
</script>

<style>
  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface2: #1e2230;
    --border: #2a2f3e;
    --accent: #4f8ef7;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --gray: #6b7280;
    --text: #e8eaf0;
    --text2: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; }

  .admin-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .admin-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn:disabled { opacity: 0.5; }

  /* ★ 승격 버튼 전용 스타일 ★ */
  .btn-sm {
    margin-left: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .btn-sm:hover { opacity: 0.8; transform: translateY(-1px); }

  .container { padding: 24px; max-width: 1400px; margin: 0 auto; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 900; color: var(--text); }
  .stat-card:nth-child(2) .stat-value { color: var(--green); }
  .stat-card:nth-child(3) .stat-value { color: var(--yellow); }
  .stat-card:nth-child(4) .stat-value { color: var(--accent); }

  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 7px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    outline: none;
  }

  .table-wrap { overflow-x: auto; }
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1000px;
  }
  .admin-table th {
    background: var(--surface2);
    color: var(--text2);
    font-size: 11px;
    font-weight: 600;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .admin-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
  }
  .admin-table tbody tr:hover { background: var(--surface2); }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-green { background: rgba(34,197,94,0.2); color: var(--green); }
  .badge-yellow { background: rgba(245,158,11,0.2); color: var(--yellow); }

  .back-link { font-size: 12px; color: var(--gray); text-decoration: none; }
  .back-link:hover { color: var(--text2); }
</style>
</head>
<body>

<header class="admin-header">
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="index.html" class="back-link">← 신청 페이지</a>
    <h1>ADMIN</h1>
    <span style="color:var(--text2);font-size:12px;">라운드업 상담부스 관리</span>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-accent" id="load-btn">새로고침</button>
    <button class="btn btn-green" id="csv-btn">CSV 다운로드</button>
  </div>
</header>

<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="stat-label">전체 신청</div><div class="stat-value" id="stat-total">-</div></div>
    <div class="stat-card"><div class="stat-label">정규 신청</div><div class="stat-value" id="stat-regular">-</div></div>
    <div class="stat-card"><div class="stat-label">예비 신청</div><div class="stat-value" id="stat-waitlist">-</div></div>
    <div class="stat-card"><div class="stat-label">신청 학생 수</div><div class="stat-value" id="stat-students">-</div></div>
  </div>

  <div class="filters">
    <span style="font-size:12px;color:var(--text2);font-weight:600;">필터:</span>
    <select id="filter-desk"><option value="all">모든 데스크</option></select>
    <select id="filter-time"><option value="all">모든 시간</option></select>
    <select id="filter-type">
      <option value="all">정규+예비</option>
      <option value="regular">정규만</option>
      <option value="waitlist">예비만</option>
    </select>
  </div>

  <div class="table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>#</th>
          <th>데스크</th>
          <th>시간</th>
          <th>상태</th>
          <th>대학</th>
          <th>학번</th>
          <th>이름</th>
          <th>연락처</th>
          <th>이메일</th>
          <th>사전질문</th>
          <th>신청시각</th>
        </tr>
      </thead>
      <tbody id="admin-tbody">
        <tr><td colspan="11" style="text-align:center;padding:40px;color:var(--gray);">데이터를 불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
